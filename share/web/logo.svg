<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="3dlib">
  <!-- Inverted triangle with 3D monogram -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Point-down triangle -->
  <path d="M8 10h48L32 58z" fill="url(#g)"/>
  <!-- Subtle inner edge -->
  <path d="M14 14h36L32 50z" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
  <!-- 3D letterforms (shared vertical of 3 and D) -->
  <g fill="#fff" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-weight="800">
    <!-- "3" left -->
    <path d="M18 22h11.5c3.2 0 5.2 1.7 5.2 4.1 0 1.7-.9 3-2.5 3.6 2 .6 3.2 2.1 3.2 4.1 0 2.8-2.3 4.7-6 4.7H18v-3.2h10.5c1.5 0 2.5-.8 2.5-2s-1-2-2.6-2H18v-3.1h10c1.4 0 2.3-.7 2.3-1.9s-.9-1.9-2.4-1.9H18V22z"/>
    <!-- "D" right, overlapping stem -->
    <path d="M30 22h8.5c6.2 0 10.5 3.8 10.5 10.2S44.7 42.5 38.5 42.5H30V22zm5.5 3.3v13.8h3.2c3.5 0 5.7-2.2 5.7-6.9s-2.2-6.9-5.7-6.9h-3.2z"/>
  </g>
</svg>
